{% extends 'base.html' %}

{% block title %}Register | Flipkart Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-2">Create Account</h1>
                    <p class="text-muted mb-0">Join Flipkart Pro and start shopping today.</p>
                </div>

                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control form-control-lg" id="full_name" name="full_name" value="{{ full_name|default:'' }}" placeholder="Enter your full name" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" value="{{ email|default:'' }}" placeholder="Enter your email" autocomplete="email" required>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create password" autocomplete="new-password" required>
                        </div>

                        <div class="col-12 col-md-6 mb-4">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">Create Account</button>
                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
