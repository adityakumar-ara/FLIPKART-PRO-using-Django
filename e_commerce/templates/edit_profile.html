{% extends 'base.html' %}

{% block title %}Edit Profile | Flipkart Pro{% endblock %}

{% block content %}
<div class="py-4">
    <h3>Edit Profile</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" href="{% url 'my_profile' %}">Cancel</a>
    </form>
</div>
{% endblock %}
